<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; font-src 'self'; img-src 'self'">
  <title>Chest Counter</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top"><img class="mark" src="icon.svg" alt="" width="26" height="26"><span class="name" data-t="appName"></span><button type="button" class="open-settings" id="open-settings" data-t-label="settingsTitle"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/><circle cx="5.5" cy="4" r="1.6"/><circle cx="10.5" cy="8" r="1.6"/><circle cx="6.5" cy="12" r="1.6"/></svg></button></header>
  <main class="page">
    <div class="view" id="home">
      <section class="balance" aria-labelledby="total-label">
        <img class="medal" src="medallion.svg" alt="">
        <div class="balance-text">
          <h1 id="total-label"><span data-t="total"></span> <span class="unit" data-t="inChests"></span></h1>
          <p class="total" id="total">0</p>
          <p class="total-average" id="total-average" hidden></p>
          <p class="stamp" id="stamp" hidden><span data-t="upToDate"></span><span id="stamp-time"></span></p>
        </div>
      </section>
      <div class="entries">
        <section class="entry entry-measured" aria-labelledby="measured-title">
          <h2 id="measured-title" data-t="measured"></h2>
          <p class="figure" id="measured"></p>
          <p class="detail" id="measured-detail"></p>
        </section>
        <section class="entry entry-estimated" aria-labelledby="estimated-title">
          <h2 id="estimated-title" data-t="estimated"></h2>
          <p class="figure" id="estimated"></p>
          <p class="detail" id="estimated-detail"></p>
        </section>
        <section class="entry entry-last" id="last" aria-labelledby="last-title" hidden>
          <h2 id="last-title" data-t="lastMatch"></h2>
          <p class="figure" id="last-chests"></p>
          <p class="detail" id="last-detail"></p>
          <p class="detail detail-more" id="last-day"></p>
        </section>
      </div>
      <button type="button" class="open-matches" id="open-matches" data-t="openMatches" hidden></button>
      <div class="field">
        <div class="field-text">
          <label for="games" data-t="gamesLabel"></label>
          <p class="hint" id="games-hint" data-t="gamesHint"></p>
        </div>
        <div class="stepper">
          <button type="button" id="less" data-t-label="less"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg></button>
          <input id="games" type="number" inputmode="numeric" min="0" max="100000" step="1" value="0" autocomplete="off" aria-describedby="games-hint">
          <button type="button" id="more" data-t-label="more"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10"/></svg></button>
        </div>
      </div>
    </div>

    <section class="view matches" id="matches" aria-labelledby="matches-title" hidden>
      <div class="matches-head">
        <button type="button" class="back" id="back"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><span data-t="back"></span></button>
        <h1 id="matches-title" data-t="matchesTitle"></h1>
      </div>
      <ol class="match-list" id="match-list"></ol>
      <p class="hint" id="matches-empty" data-t="noGames" hidden></p>
    </section>

    <section class="view settings" id="settings" aria-labelledby="settings-title" hidden>
      <div class="matches-head">
        <button type="button" class="back" id="settings-back"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><span data-t="back"></span></button>
        <h1 id="settings-title" data-t="settingsTitle"></h1>
      </div>
      <div class="option">
        <label class="check"><input type="checkbox" id="notify" aria-describedby="notify-hint"><span data-t="notify"></span></label>
        <p class="hint" id="notify-hint" data-t="notifyHint"></p>
      </div>
      <div class="option">
        <label class="check"><input type="checkbox" id="overlay" aria-describedby="overlay-hint"><span data-t="overlay"></span></label>
        <p class="hint" id="overlay-hint" aria-live="polite"></p>
      </div>
      <div class="option">
        <label class="check"><input type="checkbox" id="obs" aria-describedby="obs-hint"><span data-t="obs"></span></label>
        <p class="hint" id="obs-hint" aria-live="polite"></p>
        <div class="obs-address" id="obs-address" hidden><code id="obs-url"></code><button type="button" id="copy-obs" data-t="copy"></button></div>
      </div>
      <div class="option">
        <label class="check"><input type="checkbox" id="start-with-fortnite" aria-describedby="start-hint"><span data-t="startWithFortnite"></span></label>
        <p class="hint" id="start-hint" data-t="startHint"></p>
      </div>
    </section>

    <footer class="foot">
      <p class="status" id="status" role="status"></p>
      <div class="notice" id="notice" hidden>
        <p id="notice-text"></p>
        <button type="button" id="dismiss-notice" data-t="gotIt"></button>
      </div>
      <div class="update" id="update" hidden>
        <p id="update-text"></p>
        <button type="button" id="apply-update" data-t="restart"></button>
      </div>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
